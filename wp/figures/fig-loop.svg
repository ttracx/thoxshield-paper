<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" viewBox="0 0 680 170"><text x="0" y="16" fill="#111827" font-size="12" font-weight="700">The team loop: five roles, producer ≠ verifier</text><rect width="118" height="56" x="6" y="26" fill="#FFF" stroke="#111827" rx="5"/><text x="65" y="50" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">coordinator</text><text x="65" y="68" fill="#6B7280" font-size="8" text-anchor="middle">workorder + state</text><text x="126" y="60" fill="#6B7280" font-size="13">→</text><rect width="118" height="56" x="138" y="26" fill="#FFF" stroke="#111827" rx="5"/><text x="197" y="50" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">auditor</text><text x="197" y="68" fill="#6B7280" font-size="8" text-anchor="middle">audit + lint gate</text><text x="258" y="60" fill="#6B7280" font-size="13">→</text><rect width="118" height="56" x="270" y="26" fill="#FFF" stroke="#111827" rx="5"/><text x="329" y="50" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">hardener</text><text x="329" y="68" fill="#6B7280" font-size="8" text-anchor="middle">harden from originals</text><text x="390" y="60" fill="#6B7280" font-size="13">→</text><rect width="118" height="56" x="402" y="26" fill="#E6F4EC" stroke="#047C3D" rx="5"/><text x="461" y="50" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">verifier</text><text x="461" y="68" fill="#6B7280" font-size="8" text-anchor="middle">independent verify</text><text x="522" y="60" fill="#6B7280" font-size="13">→</text><rect width="118" height="56" x="534" y="26" fill="#FFF" stroke="#111827" rx="5"/><text x="593" y="50" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">reporter</text><text x="593" y="68" fill="#6B7280" font-size="8" text-anchor="middle">report + receipts</text><path fill="none" stroke="#6B7280" stroke-dasharray="3 3" d="M 593.0 82 V 108 H 65.0 V 86"/><text x="340" y="126" fill="#6B7280" font-size="9" text-anchor="middle">iterate until: all artifacts verified · a blocking lint finding stops the release · iteration budget exhausted (reported as failure)</text></svg>