<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" font-family="Inter,sans-serif"><text x="0" y="16" font-size="12" font-weight="700" fill="#111827">The team loop: five roles, producer &#8800; verifier</text><rect x="6" y="26" width="118" height="56" rx="5" fill="#FFFFFF" stroke="#111827"/><text x="65.0" y="50" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">coordinator</text><text x="65.0" y="68" font-size="8" fill="#6B7280" text-anchor="middle">workorder + state</text><text x="126" y="60" font-size="13" fill="#6B7280">&#8594;</text><rect x="138" y="26" width="118" height="56" rx="5" fill="#FFFFFF" stroke="#111827"/><text x="197.0" y="50" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">auditor</text><text x="197.0" y="68" font-size="8" fill="#6B7280" text-anchor="middle">audit + lint gate</text><text x="258" y="60" font-size="13" fill="#6B7280">&#8594;</text><rect x="270" y="26" width="118" height="56" rx="5" fill="#FFFFFF" stroke="#111827"/><text x="329.0" y="50" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">hardener</text><text x="329.0" y="68" font-size="8" fill="#6B7280" text-anchor="middle">harden from originals</text><text x="390" y="60" font-size="13" fill="#6B7280">&#8594;</text><rect x="402" y="26" width="118" height="56" rx="5" fill="#E6F4EC" stroke="#047C3D"/><text x="461.0" y="50" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">verifier</text><text x="461.0" y="68" font-size="8" fill="#6B7280" text-anchor="middle">independent verify</text><text x="522" y="60" font-size="13" fill="#6B7280">&#8594;</text><rect x="534" y="26" width="118" height="56" rx="5" fill="#FFFFFF" stroke="#111827"/><text x="593.0" y="50" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">reporter</text><text x="593.0" y="68" font-size="8" fill="#6B7280" text-anchor="middle">report + receipts</text><path d="M 593.0 82 V 108 H 65.0 V 86" fill="none" stroke="#6B7280" stroke-dasharray="3 3"/><text x="340.0" y="126" font-size="9" fill="#6B7280" text-anchor="middle">iterate until: all artifacts verified &#183; a blocking lint finding stops the release &#183; iteration budget exhausted (reported as failure)</text></svg>